# Azure Linux Framework Labels Catalog
#
# Declares the test labels referenced by:
#   - base/images/images.toml   ([images.<name>.test-workflows] tier maps)
#   - base/comps/components.toml ([components.<name>] `test_labels`)
#
# A label is a named, reusable test-selection record. Each label maps to
# a framework-native filter (`fmf_filter` / `lisa_criteria` /
# `openqa_suites` / `pytest_markers`) or is `pending = true` and emits
# no filter.
#
# Execution policy lives on the label, not on the gate:
#   retry_count  — integer; retries-on-failure for this label's runner
#   timeout_min  — integer; per-label wall-clock ceiling in minutes
#
# Capability tokens used by `requires_capabilities` here are produced by
# image definitions in base/images/images.toml (one bool per capability
# under each `[images.<name>.capabilities]` table).
#
# Ownership
# ---------
#   - This file is owned by the Azure Linux team and lives in this repo
#     so test selection is reviewable here.
#   - azldev consumes this file as a generic resolver — it does NOT
#     hard-code label semantics in Go.
#   - The resolver dispatches on which filter field is present, not on
#     the label name. Prefixes (tmt_, lisa_, ...) are descriptive only.

[metadata]
version = "1.0.0"
schema_version = 1
author = "Azure Linux Team"
description = "Azure Linux framework label catalog"

# =============================================================================
# Framework enablement
#
# Distro-wide kill switch for label dispatch. A label whose framework is
# disabled here is skipped (with a clear reason in --format explain) and
# its filter is not emitted.
#
# Defaults to enabled if a framework is not listed.
# =============================================================================

[frameworks]
tmt    = { enabled = false }
lisa   = { enabled = true }
openqa = { enabled = false }
pytest = { enabled = true }
image  = { enabled = true }

# =============================================================================
# TMT labels (Test Management Tool / fmf filter syntax)
# =============================================================================

[tmt_labels.tmt_tier0]
description = "TMT smoke tier — fastest, most critical"
type = "tmt"
fmf_filter = "tier:0"
estimated_minutes = 15
retry_count = 2
timeout_min = 30

[tmt_labels.tmt_tier1]
description = "TMT integration tier — medium coverage"
type = "tmt"
fmf_filter = "tier:1"
estimated_minutes = 45
retry_count = 1
timeout_min = 90

[tmt_labels.tmt_tier2]
description = "TMT full tier — comprehensive"
type = "tmt"
fmf_filter = "tier:2"
estimated_minutes = 120
retry_count = 1
timeout_min = 240


# =============================================================================
# LISA labels (Linux Integration Services Automation)
# =============================================================================

[lisa_labels.lisa_priority0]
description = "LISA PR-gate priority — critical path"
type = "lisa"
lisa_criteria = { priority = [0] }
estimated_minutes = 20
retry_count = 2
timeout_min = 40

[lisa_labels.lisa_smoke]
description = "LISA smoke test — fastest PR gate"
type = "lisa"
lisa_criteria = { testcaseNames = ["smoke_test"] }
estimated_minutes = 10
retry_count = 2
timeout_min = 20

[lisa_labels.lisa_priority1]
description = "LISA important functional tests"
type = "lisa"
lisa_criteria = { priority = [1] }
estimated_minutes = 60
retry_count = 1
timeout_min = 120

[lisa_labels.lisa_priority2]
description = "LISA extended coverage"
type = "lisa"
lisa_criteria = { priority = [2] }
estimated_minutes = 180
retry_count = 1
timeout_min = 360

[lisa_labels.lisa_ltp]
description = "LISA kernel LTP (Linux Test Project) suite"
type = "lisa"
lisa_criteria = { testcaseNames = ["verify_ltp_lite"] }
estimated_minutes = 90
retry_count = 1
timeout_min = 180

[lisa_labels.lisa_xfs]
description = "LISA XFS data-disk tests (standard + NVMe)"
type = "lisa"
lisa_criteria = { testcaseNames = ["verify_xfs_standard_datadisk", "verify_xfs_nvme_datadisk"] }
requires_capabilities = ["storage"]
estimated_minutes = 60
retry_count = 1
timeout_min = 120

[lisa_labels.lisa_perf]
description = "LISA performance test areas (network, nested, nvme, perf_tool, storage)"
type = "lisa"
lisa_criteria = { criteria = [
  { area = "network",   category = "performance" },
  { area = "nested",    category = "performance" },
  { area = "nvme",      category = "performance" },
  { area = "perf_tool", category = "performance" },
  { area = "storage",   category = "performance" },
] }
estimated_minutes = 240
retry_count = 1
timeout_min = 480


# =============================================================================
# OpenQA labels (suite-list selection)
# =============================================================================

[openqa_labels.openqa_install_smoke]
description = "OpenQA basic installation validation"
type = "openqa"
openqa_suites = ["install_default", "install_package_set_minimal"]
estimated_minutes = 30
retry_count = 2
timeout_min = 60

[openqa_labels.openqa_install_comprehensive]
description = "OpenQA full installation matrix"
type = "openqa"
openqa_suites = [
    "install_default",
    "install_delete_pata",
    "install_sata",
    "install_multi",
    "install_software_raid",
    "install_lvmthin",
]
estimated_minutes = 120
retry_count = 1
timeout_min = 240


# =============================================================================
# pytest labels (in-tree, filesystem-based image tests)
#
# Pytest labels target image tests that live under base/images/tests/cases/
# and are dispatched via `pytest`. Each label declares:
#   - `pytest_markers`  : -m expressions to select tests
#   - `pytest_files`    : optional path globs to limit collection
#   - `pytest_args`     : optional extra args passed verbatim
#
# The resolver groups all pytest labels in a workflow into a single
# combined invocation (union of markers/files, ordered args) so the
# runner can fire one pytest process per workflow.
# =============================================================================

[pytest_labels.pytest_container_static]
description = "Static container validation (image-tree pytest)"
type = "pytest"
pytest_markers = ["static_container_test"]
pytest_files = ["cases/**/*.py"]
requires_capabilities = ["container"]
estimated_minutes = 25
retry_count = 2
timeout_min = 50

[pytest_labels.pytest_container_runtime]
description = "Runtime container behavior (image-tree pytest)"
type = "pytest"
pytest_markers = ["runtime_container_tests"]
pytest_files = ["cases/**/*.py"]
requires_capabilities = ["container"]
estimated_minutes = 45
retry_count = 1
timeout_min = 90

[pytest_labels.pytest_vm_basic]
description = "In-VM pytest smoke tests"
type = "pytest"
pytest_markers = ["vm_basic"]
pytest_files = ["cases/**/*.py"]
requires_capabilities = ["machine-bootable"]
estimated_minutes = 30
retry_count = 2
timeout_min = 60

[pytest_labels.pytest_container_release]
description = "Release-gate container pytest with coverage collection"
type = "pytest"
pytest_markers = ["static_container_test"]
pytest_files = ["cases/**/*.py"]
pytest_args = [
    "--strict-markers",
    "--durations=20",
    "--cov=base/images/tests/cases",
    "--cov-report=term-missing",
]
requires_capabilities = ["container"]
estimated_minutes = 60
retry_count = 1
timeout_min = 120



# Each label is `pending = true` until a concrete framework binding (pytest
# marker, lisa criteria, etc.) is provided.
[image_labels]
vm_smoke                  = { description = "Lightweight VM smoke validation", requires_capabilities = ["machine-bootable"], estimated_minutes = 20, pending = true }
vm_basic_tests            = { description = "Basic VM functional coverage", requires_capabilities = ["machine-bootable"], estimated_minutes = 40, pending = true }
container_smoke           = { description = "Lightweight container smoke validation", requires_capabilities = ["container"], estimated_minutes = 15, pending = true }
base_container_validation = { description = "Base-image container validation", requires_capabilities = ["container"], estimated_minutes = 25, pending = true }
distroless_validation     = { description = "Distroless / minimal image validation", requires_capabilities = ["container"], estimated_minutes = 30, pending = true }
minimal_surface_tests     = { description = "Validation of minimal image surface", estimated_minutes = 20, pending = true }
oci_compliance            = { description = "OCI specification compliance", requires_capabilities = ["container"], estimated_minutes = 25, pending = true }
oci_security              = { description = "OCI security validation", requires_capabilities = ["container"], estimated_minutes = 30, pending = true }
registry_integration      = { description = "Container registry integration", requires_capabilities = ["container"], estimated_minutes = 20, pending = true }
container_security_scan   = { description = "Container security scanning", requires_capabilities = ["container"], estimated_minutes = 40, pending = true }

